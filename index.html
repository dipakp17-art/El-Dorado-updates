<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get El Dorado</title>
<style>
  :root { --bg:#0e1116; --card:#171c24; --text:#f2f4f8; --muted:#9aa3b2; --accent:#e3b341; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:radial-gradient(circle at 30% 0%, #2a2410, var(--bg) 60%); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .card { width:100%; max-width:380px; background:var(--card); border-radius:26px; padding:28px 22px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  .logo { width:84px; height:84px; margin:0 auto 14px; border-radius:24px; background:linear-gradient(135deg,#f5d36b,#b8860b);
          display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:700; color:#1b1405; }
  h1 { font-size:24px; margin:6px 0 4px; }
  p { color:var(--muted); font-size:15px; line-height:1.45; margin:6px 0 18px; }
  a.btn { display:block; text-decoration:none; font-weight:600; font-size:16px; border-radius:26px; padding:14px; margin:10px 0; background:var(--accent); color:#1b1405; }
  ol { text-align:left; color:var(--muted); font-size:14px; line-height:1.6; padding-left:20px; }
  #ver { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">E</div>
  <h1>El Dorado</h1>
  <p>Private chat, voice and calls. End-to-end encrypted. Free.</p>
  <a class="btn" id="dl" href="app.json">Download for Android</a>
  <div id="ver"></div>
  <ol>
    <li>Tap <b>Download</b> and open the file.</li>
    <li>If Android asks, allow installing from this source.</li>
    <li>Open El Dorado, enter your name, and you're in.</li>
  </ol>
</div>
<script>
  fetch("app.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (a) {
    document.getElementById("dl").href = a.apk.replace("https://raw.githubusercontent.com/dipakp17-art/El-Dorado-updates/main/", "");
    document.getElementById("ver").textContent = "Version " + a.versionName + " · " + Math.round(a.size / 1048576) + " MB";
  }).catch(function () {});
</script>
</body>
</html>
